<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no, interactive-widget=resizes-content">
<title>TDM 350 - EXACT MAP COPY</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;touch-action:none;user-select:none;-webkit-user-select:none}
html,body{width:100%;height:100%;height:100dvh;background:#000;overflow:hidden;position:fixed;overscroll-behavior:none}
#game{position:fixed;left:0;top:0;right:0;bottom:0;width:100vw;width:100dvw;height:100vh;height:100dvh;display:block;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);background:#3d6b22}
#joy{position:fixed;left:5vw;left:calc(5vw + env(safe-area-inset-left,0px));bottom:10vh;bottom:calc(10vh + env(safe-area-inset-bottom,0px));width:32vw;max-width:135px;height:32vw;max-height:135px;border:2px solid #fff;border-radius:50%;background:rgba(255,255,255,0.15);z-index:10}
#knob{position:absolute;left:50%;top:50%;width:44%;height:44%;background:#fff;border-radius:50%;transform:translate(-50%,-50%)}
#cam{position:fixed;right:0;top:0;width:65vw;height:100vh;height:100dvh;z-index:5}
#top{position:fixed;top:0;top:env(safe-area-inset-top,0px);left:0;right:0;background:rgba(0,0,0,0.7);color:#0f0;padding:6px;font:700 11px monospace;z-index:20}
#btns{position:fixed;right:4vw;right:calc(4vw + env(safe-area-inset-right,0px));bottom:10vh;bottom:calc(10vh + env(safe-area-inset-bottom,0px));display:flex;gap:3vw;z-index:10}
.b{width:19vw;max-width:72px;height:19vw;max-height:72px;border-radius:50%;border:2px solid #fff;background:rgba(0,0,0,0.6);color:#fff;font:700 10px sans-serif}
.b.active{background:#00aaff}
@media screen and (orientation: portrait){
  body{transform:rotate(90deg);transform-origin:50% 50%;width:100vh;width:100dvh;height:100vw;height:100dvw;position:fixed;left:50%;top:50%;margin-left:-50vh;margin-top:-50vw;overflow:hidden}
}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="joy"><div id="knob"></div></div>
<div id="cam"></div>
<div id="top">EXACT MAP COPY - Image se 1:1</div>
<div id="btns">
<button class="b active" id="stand">STANDING</button>
<button class="b" id="crouch">CROUCH</button>
<button class="b" id="prone">PRONE</button>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const MAP=350, SPEEDS={stand:15.4,sprint:20.6,crouch:4.2,crouchSprint:15.7,prone:3.9};
let curSpeed=SPEEDS.stand, state='stand', moveX=0, moveZ=0, camYaw=0, targetYaw=0, camPitch=20, isSprint=false;
const canvas=document.getElementById('game');
const scene=new THREE.Scene(); scene.background=new THREE.Color(0x3d6b22);
const camera=new THREE.PerspectiveCamera(65, innerWidth/innerHeight, 0.1, 1000);
const renderer=new THREE.WebGLRenderer({canvas, antialias:true});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
scene.add(new THREE.AmbientLight(0xffffff,0.85));
const sun=new THREE.DirectionalLight(0xffffff,0.6); sun.position.set(60,120,60); scene.add(sun);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(MAP,MAP), new THREE.MeshLambertMaterial({color:0x4a8a2e}));
ground.rotation.x=-Math.PI/2; scene.add(ground);
const grid=new THREE.GridHelper(MAP,30,0x1a3310,0x2d5a1f); grid.position.y=0.1; scene.add(grid);
const charGroup=new THREE.Group();
const body=new THREE.Mesh(new THREE.BoxGeometry(1.4,3,0.9), new THREE.MeshLambertMaterial({color:0x0088ff})); body.position.y=2.6; charGroup.add(body);
const head=new THREE.Mesh(new THREE.BoxGeometry(0.9,0.9,0.9), new THREE.MeshLambertMaterial({color:0xffdbac})); head.position.y=4.7; charGroup.add(head);
const legs=new THREE.Mesh(new THREE.BoxGeometry(1.2,1.8,0.9), new THREE.MeshLambertMaterial({color:0x0033aa})); legs.position.y=0.9; charGroup.add(legs);
charGroup.position.set(-140,0,140); scene.add(charGroup); // Spawn 1 pe

function box(x,z,w,h,d,c){ const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d), new THREE.MeshLambertMaterial({color:c})); m.position.set(x,h/2,z); scene.add(m); return m; }
function wallRect(cx,cz,w,d,thickness=1.5,height=5,color=0x8b7d6b){
  const t=thickness,h=height;
  box(cx-w/2,cz,t,h,d,color); box(cx+w/2,cz,t,h,d,color);
  box(cx,cz-d/2,w,h,t,color); box(cx,cz+d/2,w,h,t,color);
}
function sandbag(cx,cz,w,d){ wallRect(cx,cz,w,d,1.5,4.5,0x8b7d6b); }

// ====== EXACT MAP FROM YOUR IMAGE ======
// SPAWN 1 TOP LEFT - Trees + 2 Cars
box(-125,125,16,5,7,0x3d2b1f); box(-110,105,16,5,7,0x3d2b1f);
for(let i=0;i<6;i++){ const tx=-145+Math.random()*20, tz=115+Math.random()*35; const tr=box(tx,tz,1.2,7,1.2,0x3d2b1f); const lv=new THREE.Mesh(new THREE.SphereGeometry(5.5,6,6), new THREE.MeshLambertMaterial({color:0x1a5a1a})); lv.position.set(tr.position.x,10,tr.position.z); scene.add(lv); }

// SPAWN 2 TOP RIGHT - Trees + 2 Cars
box(110,115,16,5,7,0x3d2b1f); box(130,95,16,5,7,0x3d2b1f);
for(let i=0;i<6;i++){ const tx=115+Math.random()*30, tz=105+Math.random()*35; const tr=box(tx,tz,1.2,7,1.2,0x3d2b1f); const lv=new THREE.Mesh(new THREE.SphereGeometry(5.5,6,6), new THREE.MeshLambertMaterial({color:0x1a5a1a})); lv.position.set(tr.position.x,10,tr.position.z); scene.add(lv); }

// SPAWN 4 BOTTOM LEFT - Trees + 2 Cars
box(-110,-110,16,5,7,0x3d2b1f); box(-90,-130,16,5,7,0x3d2b1f);
for(let i=0;i<8;i++){ const tx=-145+Math.random()*35, tz=-105-Math.random()*45; const tr=box(tx,tz,1.2,7,1.2,0x3d2b1f); const lv=new THREE.Mesh(new THREE.SphereGeometry(5.5,6,6), new THREE.MeshLambertMaterial({color:0x1a5a1a})); lv.position.set(tr.position.x,10,tr.position.z); scene.add(lv); }

// SPAWN 3 BOTTOM RIGHT - Trees + 3 Cars (image me 3 hain)
box(110,-105,16,5,7,0x3d2b1f); box(90,-125,16,5,7,0x3d2b1f); box(125,-90,16,5,7,0x3d2b1f);
for(let i=0;i<8;i++){ const tx=100+Math.random()*45, tz=-95-Math.random()*55; const tr=box(tx,tz,1.2,7,1.2,0x3d2b1f); const lv=new THREE.Mesh(new THREE.SphereGeometry(5.5,6,6), new THREE.MeshLambertMaterial({color:0x1a5a1a})); lv.position.set(tr.position.x,10,tr.position.z); scene.add(lv); }

// HOUSES - 7 exact image position
box(-45,140,14,10,11,0x5a4a3a); // Top left house
box(45,138,14,10,11,0x5a4a3a); // Top right house
box(-135,0,14,10,11,0x5a4a3a); // Mid left house
box(105,25,14,10,11,0x5a4a3a); // Mid right house
box(135,-45,14,10,11,0x5a4a3a); // Bottom right house
box(-45,-145,14,10,11,0x5a4a3a); // Bottom left house
box(20,-145,14,10,11,0x5a4a3a); // Bottom mid house

// SANDBAG WALLS - 8 exact image position
sandbag(20,95,32,22); // Top right - image top right wall
sandbag(-60,60,28,28); // Mid top - with rocks inside
sandbag(-115,25,34,38); // Mid left upper
sandbag(-115,-25,34,44); // Mid left lower
sandbag(80,-40,32,36); // Right middle - L shape ke paas
sandbag(-35,-85,36,24); // Bottom center
sandbag(65,-10,2,50); // Right vertical wall (C-Shape)
sandbag(135,-55,28,2); // Right bottom small wall

// L-SHAPE WALLS (C-Shape from image)
box(80,-18,1.5,4.5,28,0x8b7d6b); // Vertical part of C on right
box(-35,-95,1.5,4.5,18,0x8b7d6b); // Small leg bottom center

// LARGE BOULDERS - 4 exact position from image
box(15,40,13,8,11,0x4a3a2e); // Big rock middle
box(-18,0,11,7,9,0x4a3a2e); // Mid small big
box(-50,-22,13,9,11,0x4a3a2e); // Mid bottom big
box(10,-22,11,8,10,0x4a3a2e); // Mid bottom right big

// MEDIUM & SMALL BOULDERS - exact scattered as per image
const rockPos=[[-60,65,4,3,4],[15,10,3,2,3],[40,20,3,2,3],[55,70,4,3,4],[65,65,3,2,3],[55,-10,3,2,3],[50,0,2,1.5,2],[-15,0,3,2,3],[-55,5,3,2,3],[-5,-10,4,3,4],[-20,-15,2,1.5,2],[-5,-30,2,1.5,2],[10,-50,3,2,3],[-35,-45,2,1.5,2],[20,-60,2,1.5,2],[60,-45,2,1.5,2],[65,30,3,2,3],[80,70,3,2,3],[55,60,3,2,3]];
rockPos.forEach(p=> box(p[0],p[1],p[2],p[3],p[4],0x5a5a5a));

// TYRES - 30 exact image positions
const tyrePos=[[-85,105],[-55,85],[-105,45],[35,65],[55,85],[45,55],[-35,55],[-20,65],[-40,20],[-40,15],[-75,15],[-85,5],[-55,-15],[-15,-10],[20,-10],[40,-20],[0,-45],[0,-60],[30,-60],[15,-115],[35,-105],[70,0],[125,0],[105,-10],[115,-25],[120,-30],[30,-85],[30,-80],[20,85],[20,90]];
tyrePos.forEach(p=>{ const t=new THREE.Mesh(new THREE.TorusGeometry(1.1,0.35,6,10), new THREE.MeshLambertMaterial({color:0x111111})); t.position.set(p[0],0.5,p[1]); t.rotation.x=Math.PI/2; scene.add(t); });

// CRATES - exact from image
const cratePos=[[-55,110,4,3,4],[-40,110,3,2,3],[-60,105,4,3,4],[0,130,4,3,4],[30,100,4,3,4],[-145,30,4,3,4],[-115,30,4,3,4],[-105,-25,4,3,4],[110,5,6,4,6],[70,70,3,2,3],[20,90,3,2,3],[5,20,3,2,3],[80,-60,4,3,4],[0,-70,6,4,6],[0,-90,4,3,4],[80,-60,4,3,4],[50,-100,3,2,3],[50,-70,4,3,4],[80,80,3,2,3]];
cratePos.forEach(p=> box(p[0],p[1],p[2],p[3],p[4],0x8b6a2e));

// PLANKS - 10 exact from image
const plankPos=[[-95,55,8,0.5,1.2],[-140,5,6,0.5,1],[-130,-20,5,0.5,1],[-65,-15,7,0.5,1.2],[-15,-35,4,0.5,1],[40,-5,3,0.5,1],[70,35,6,0.5,1.2],[120,5,7,0.5,1.2],[95,-105,9,0.5,1.2],[10,-125,7,0.5,1.2],[-85,-90,8,0.5,1.2]];
plankPos.forEach(p=> box(p[0],p[1],p[2],p[3],p[4],0xc2a67a));

const joy=document.getElementById('joy'), knob=document.getElementById('knob');
let joyActive=false, cx=0, cy=0;
function getCenter(){const rc=joy.getBoundingClientRect(); return {x:rc.left+rc.width/2,y:rc.top+rc.height/2};}
joy.addEventListener('touchstart', e=>{ e.preventDefault(); joyActive=true; const c=getCenter(); cx=c.x; cy=c.y; handle(e.touches[0]); goFS(); },{passive:false});
joy.addEventListener('touchmove', e=>{ e.preventDefault(); if(joyActive) handle(e.touches[0]); },{passive:false});
joy.addEventListener('touchend', e=>{ e.preventDefault(); joyActive=false; moveX=0; moveZ=0; isSprint=false; knob.style.transform='translate(-50%,-50%)'; },{passive:false});
function handle(t){
  let dx=t.clientX-cx, dy=t.clientY-cy;
  let dist=Math.sqrt(dx*dx+dy*dy), max=45;
  if(dist>max){ dx=dx/max*45; dy=dy/max*45; dist=45; }
  knob.style.transform=`translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
  moveX = dx/max; moveZ = -dy/max;
  let force=dist/max;
  if(force>0.82){ isSprint=true; curSpeed=state==='crouch'?SPEEDS.crouchSprint:state==='prone'?SPEEDS.prone:SPEEDS.sprint; }
  else { isSprint=false; curSpeed=state==='crouch'?SPEEDS.crouch:state==='prone'?SPEEDS.prone:SPEEDS.stand; }
}
const camArea=document.getElementById('cam'); let lx=0,ly=0;
camArea.addEventListener('touchstart', e=>{ lx=e.touches[0].clientX; ly=e.touches[0].clientY; goFS(); },{passive:false});
camArea.addEventListener('touchmove', e=>{
  e.preventDefault();
  const dx=e.touches[0].clientX-lx;
  const dy=e.touches[0].clientY-ly;
  targetYaw -= dx*0.5;
  camPitch += dy*0.8; // Tumhara fixed wala - up=up, down=down
  camPitch=Math.max(-45,Math.min(70,camPitch));
  lx=e.touches[0].clientX; ly=e.touches[0].clientY;
},{passive:false});

const standBtn=document.getElementById('stand'), crouchBtn=document.getElementById('crouch'), proneBtn=document.getElementById('prone');
function setState(s){ state=s; standBtn.classList.toggle('active',s==='stand'); crouchBtn.classList.toggle('active',s==='crouch'); proneBtn.classList.toggle('active',s==='prone'); if(s==='stand'){ body.scale.y=1; body.position.y=2.6; head.position.y=4.7; legs.scale.y=1; } if(s==='crouch'){ body.scale.y=0.65; body.position.y=1.7; head.position.y=3.1; legs.scale.y=0.6; } if(s==='prone'){ body.scale.y=0.28; body.position.y=0.7; head.position.y=1.2; legs.scale.y=0.28; } curSpeed=s==='crouch'?SPEEDS.crouch:s==='prone'?SPEEDS.prone:SPEEDS.stand; }
standBtn.addEventListener('touchstart', e=>{e.preventDefault(); setState('stand'); goFS();},{passive:false});
crouchBtn.addEventListener('touchstart', e=>{e.preventDefault(); setState('crouch'); goFS();},{passive:false});
proneBtn.addEventListener('touchstart', e=>{e.preventDefault(); setState('prone'); goFS();},{passive:false});

let fsDone=false;
function goFS(){
  if(fsDone) return; fsDone=true;
  const el=document.documentElement;
  if(el.requestFullscreen) el.requestFullscreen().catch(()=>{});
  if(screen.orientation && screen.orientation.lock){ screen.orientation.lock('landscape').catch(()=>{}); }
  window.scrollTo(0,1);
  setTimeout(()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); },200);
}
document.addEventListener('touchstart', goFS, {once:true});

function animate(){
  requestAnimationFrame(animate);
  camYaw+=(targetYaw-camYaw)*0.15;
  if(moveX!==0||moveZ!==0){
    const rad=THREE.MathUtils.degToRad(camYaw);
    const finalX = -moveZ*Math.sin(rad) + moveX*Math.cos(rad);
    const finalZ = -moveZ*Math.cos(rad) - moveX*Math.sin(rad);
    charGroup.position.x+=finalX*curSpeed*0.06;
    charGroup.position.z+=finalZ*curSpeed*0.06;
    charGroup.rotation.y=Math.atan2(finalX,finalZ);
    const lim=MAP/2-4; charGroup.position.x=Math.max(-lim,Math.min(lim,charGroup.position.x)); charGroup.position.z=Math.max(-lim,Math.min(lim,charGroup.position.z));
  }
  const dist=16, h=7 + (state==='crouch'?-2:state==='prone'?-4:0);
  const yawRad=THREE.MathUtils.degToRad(camYaw), pitchRad=THREE.MathUtils.degToRad(camPitch);
  camera.position.x=charGroup.position.x+Math.sin(yawRad)*Math.cos(pitchRad)*dist;
  camera.position.z=charGroup.position.z+Math.cos(yawRad)*Math.cos(pitchRad)*dist;
  camera.position.y=charGroup.position.y+h+Math.sin(pitchRad)*dist*0.6 + 2;
  camera.lookAt(charGroup.position.x, charGroup.position.y+2, charGroup.position.z);
  document.getElementById('top').textContent=`350 FT | ${curSpeed.toFixed(1)} ft/s | EXACT IMAGE MAP`;
  renderer.render(scene,camera);
}
animate();
window.addEventListener('resize', ()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); });
</script>
</body>
</html>
