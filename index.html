<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>PUBG Lite - Yasna</title>
<style>
  body { margin:0; overflow:hidden; background:#000; font-family: sans-serif; }
  #canvas { width:100%; height:100vh; display:block; }
  #joystick-zone { position:absolute; bottom:20px; left:20px; width:130px; height:130px; background:rgba(255,255,255,0.1); border-radius:50%; z-index:10; }
  #joystick-stick { position:absolute; width:60px; height:60px; background:rgba(255,255,255,0.4); border-radius:50%; left:35px; top:35px; }
  #camera-zone { position:absolute; top:0; right:0; width:50%; height:100%; z-index:5; }
  #controls { position:absolute; bottom:20px; right:20px; display:flex; flex-direction:column; gap:10px; z-index:10; }
  .btn { width:60px; height:60px; background:rgba(0,0,0,0.5); border:2px solid rgba(255,255,255,0.5); border-radius:50%; color:white; font-size:12px; font-weight:bold; }
  .btn.active { background:orange; color:black; }
  #runBtn { position:absolute; bottom:160px; left:160px; z-index:10; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="joystick-zone"><div id="joystick-stick"></div></div>
<div id="camera-zone"></div>
<div id="controls">
  <button class="btn" id="crouchBtn">CROUCH</button>
  <button class="btn" id="proneBtn">PRONE</button>
</div>
<button class="btn" id="runBtn">RUN</button>
<canvas id="canvas"></canvas>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87CEEB);
scene.fog = new THREE.Fog(0x87CEEB, 10, 50);

const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('canvas'), antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 1000);
let cameraYaw = 0, cameraPitch = 15;

const light = new THREE.DirectionalLight(0xffffff, 1.5);
light.position.set(10, 20, 10);
light.castShadow = true;
light.shadow.mapSize.width = 2048;
light.shadow.mapSize.height = 2048;
scene.add(light);
scene.add(new THREE.AmbientLight(0xffffff, 0.6));

const ground = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), new THREE.MeshStandardMaterial({color: 0x4a7a3a}));
ground.rotation.x = -Math.PI/2;
ground.receiveShadow = true;
scene.add(ground);

let model, mixer, actions = {}, activeAction;
let moveVector = { x:0, y:0 };
let isRunning = false, isCrouching = false, isProne = false;

const loader = new GLTFLoader();
loader.load('./models/Soldier.glb', (gltf)=>{
  model = gltf.scene;
  model.traverse(n=>{ if(n.isMesh){ n.castShadow = true; } });
  model.scale.set(1,1,1);
  scene.add(model);
  
  mixer = new THREE.AnimationMixer(model);
  gltf.animations.forEach(clip=>{
    const name = clip.name.toLowerCase();
    actions[name] = mixer.clipAction(clip);
  });
  // Soldier.glb has: Idle, Walk, Run
  if(actions['idle']) { activeAction = actions['idle']; activeAction.play(); }
  console.log('Animations:', Object.keys(actions));
}, undefined, (e)=>{ console.error(e); alert('Model load error - check path ./models/Soldier.glb'); });

const clock = new THREE.Clock();
let targetRotation = 0;

function updateAnimation(){
  if(!actions || !model) return;
  let want = 'idle';
  const moving = Math.hypot(moveVector.x, moveVector.y) > 0.1;
  
  if(isProne) want = moving ? 'walk' : 'idle'; // prone has no anim in this model, use idle
  else if(isCrouching) want = moving ? 'walk' : 'idle';
  else want = moving ? (isRunning ? 'run' : 'walk') : 'idle';

  if(!actions[want]) want = 'idle';
  if(activeAction !== actions[want]){
    if(activeAction) activeAction.fadeOut(0.2);
    activeAction = actions[want];
    activeAction.reset().fadeIn(0.2).play();
  }
  // Speed multiplier for mixer
  activeAction.timeScale = isProne ? 0.5 : isCrouching ? 0.7 : isRunning ? 1.3 : 1;
}

function animate(){
  requestAnimationFrame(animate);
  const delta = clock.getDelta();
  if(mixer) mixer.update(delta);

  if(model){
    // Rotation from joystick + camera
    if(Math.hypot(moveVector.x, moveVector.y) > 0.1){
      const angle = Math.atan2(moveVector.x, moveVector.y);
      targetRotation = angle + THREE.MathUtils.degToRad(cameraYaw);
      model.rotation.y = THREE.MathUtils.lerp(model.rotation.y, targetRotation, 0.1);
      
      let speed = 2.5; // standing
      if(isCrouching) speed = 1.0;
      if(isProne) speed = 0.4;
      if(isRunning && !isCrouching && !isProne) speed = 4.5;
      
      const forward = new THREE.Vector3(0,0,1).applyAxisAngle(new THREE.Vector3(0,1,0), targetRotation);
      model.position.add(forward.multiplyScalar(moveVector.y > 0 ? speed*delta : speed*delta*0.8));
      const sideways = new THREE.Vector3(1,0,0).applyAxisAngle(new THREE.Vector3(0,1,0), targetRotation);
      model.position.add(sideways.multiplyScalar(moveVector.x* speed*delta));
    }
    
    // Camera follow like PUBG - third person
    const dist = isProne ? 4 : 6;
    const height = isProne ? 0.5 : isCrouching ? 1.2 : 1.8;
    const radYaw = THREE.MathUtils.degToRad(cameraYaw);
    const radPitch = THREE.MathUtils.degToRad(cameraPitch);
    
    camera.position.x = model.position.x + Math.sin(radYaw) * dist;
    camera.position.z = model.position.z + Math.cos(radYaw) * dist;
    camera.position.y = model.position.y + height + Math.sin(radPitch)*2;
    camera.lookAt(model.position.x, model.position.y + (isProne?0.2:1), model.position.z);
  }
  updateAnimation();
  renderer.render(scene, camera);
}
animate();

// JOYSTICK LOGIC
const zone = document.getElementById('joystick-zone');
const stick = document.getElementById('joystick-stick');
let joyActive = false;
let startPos = {x:0,y:0};

function handleJoyMove(clientX, clientY){
  const rect = zone.getBoundingClientRect();
  const centerX = rect.left + rect.width/2;
  const centerY = rect.top + rect.height/2;
  let dx = clientX - centerX;
  let dy = clientY - centerY;
  const dist = Math.hypot(dx, dy);
  const max = 40;
  if(dist > max){ dx = dx/dist*max; dy = dy/dist*max; }
  stick.style.transform = `translate(${dx}px, ${dy}px)`;
  moveVector.x = dx/max;
  moveVector.y = -dy/max;
}

zone.addEventListener('touchstart', e=>{ joyActive=true; });
zone.addEventListener('touchmove', e=>{
  if(!joyActive) return;
  handleJoyMove(e.touches[0].clientX, e.touches[0].clientY);
});
zone.addEventListener('touchend', ()=>{
  joyActive=false;
  stick.style.transform = `translate(0px,0px)`;
  moveVector.x=0; moveVector.y=0;
});

// Desktop keys
const keys={};
window.addEventListener('keydown', e=>{ keys[e.key.toLowerCase()]=true; updateKeys(); });
window.addEventListener('keyup', e=>{ keys[e.key.toLowerCase()]=false; updateKeys(); });
function updateKeys(){
  moveVector.x = (keys['d']||keys['arrowright']?1:0) + (keys['a']||keys['arrowleft']?-1:0);
  moveVector.y = (keys['w']||keys['arrowup']?1:0) + (keys['s']||keys['arrowdown']?-1:0);
  isRunning = !!keys['shift'];
}

// CAMERA ROTATION - Right side drag
const camZone = document.getElementById('camera-zone');
let camStartX=0, camStartY=0, startYaw=0, startPitch=15;
camZone.addEventListener('touchstart', e=>{
  camStartX = e.touches[0].clientX;
  camStartY = e.touches[0].clientY;
  startYaw = cameraYaw;
  startPitch = cameraPitch;
});
camZone.addEventListener('touchmove', e=>{
  const dx = e.touches[0].clientX - camStartX;
  const dy = e.touches[0].clientY - camStartY;
  cameraYaw = startYaw - dx*0.3;
  cameraPitch = THREE.MathUtils.clamp(startPitch + dy*0.2, -20, 60);
});
let mouseDown=false;
camZone.addEventListener('mousedown', e=>{ mouseDown=true; camStartX=e.clientX; camStartY=e.clientY; startYaw=cameraYaw; startPitch=cameraPitch; });
window.addEventListener('mousemove', e=>{
  if(!mouseDown) return;
  cameraYaw = startYaw - (e.clientX - camStartX)*0.3;
  cameraPitch = THREE.MathUtils.clamp(startPitch + (e.clientY - camStartY)*0.2, -20, 60);
});
window.addEventListener('mouseup', ()=>mouseDown=false);

// BUTTONS - Crouch, Prone, Run
document.getElementById('crouchBtn').addEventListener('click', function(){
  isCrouching = !isCrouching;
  if(isCrouching) isProne=false;
  this.classList.toggle('active', isCrouching);
  document.getElementById('proneBtn').classList.remove('active');
});
document.getElementById('proneBtn').addEventListener('click', function(){
  isProne = !isProne;
  if(isProne) isCrouching=false;
  this.classList.toggle('active', isProne);
  document.getElementById('crouchBtn').classList.remove('active');
});
const runBtn = document.getElementById('runBtn');
runBtn.addEventListener('touchstart', ()=>{ isRunning=true; runBtn.classList.add('active'); });
runBtn.addEventListener('touchend', ()=>{ isRunning=false; runBtn.classList.remove('active'); });
runBtn.addEventListener('mousedown', ()=>{ isRunning=true; });
runBtn.addEventListener('mouseup', ()=>{ isRunning=false; });

window.addEventListener('resize', ()=>{
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
