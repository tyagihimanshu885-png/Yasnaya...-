<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>FINAL MAP 350x350 FT</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;touch-action:none;user-select:none}
html,body{width:100%;height:100%;background:#000;overflow:hidden;position:fixed}
#game{position:fixed;left:0;top:0;width:100vw;height:100vh}
#joy{position:fixed;left:5vw;bottom:10vh;width:32vw;max-width:135px;height:32vw;max-height:135px;border:2px solid #FFD700;border-radius:50%;background:rgba(255,255,255,0.15);z-index:10}
#knob{position:absolute;left:50%;top:50%;width:44%;height:44%;background:#FFD700;border-radius:50%;transform:translate(-50%,-50%)}
#top{position:fixed;top:0;left:0;right:0;background:rgba(0,0,0,0.85);color:#FFD700;padding:6px 10px;font:700 11px monospace;z-index:20}
#btns{position:fixed;right:3vw;bottom:10vh;display:flex;gap:2.5vw;z-index:10}
.b{width:18vw;max-width:70px;height:18vw;max-height:70px;border-radius:50%;border:2px solid #FFD700;background:rgba(0,0,0,0.7);color:#fff;font:700 10px sans-serif}
.b.active{background:#FFD700;color:#000}
#loading{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);color:#FFD700;font:800 13px sans-serif;background:rgba(0,0,0,0.9);padding:14px 20px;border-radius:10px;z-index:100;border:2px solid #FFD700;text-align:center}
</style>
<script type="importmap">{ "imports": { "three": "https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.128.0/examples/jsm/" } }</script>
</head>
<body>
<div id="loading">FINAL MAP 350x350 FT<br><small>122,500 Sq Ft</small></div>
<canvas id="game"></canvas>
<div id="joy"><div id="knob"></div></div>
<div id="top">350x350 FT | STAND</div>
<div id="btns"><button class="b active" id="stand">STAND</button><button class="b" id="crouch">CROUCH</button><button class="b" id="prone">PRONE</button></div>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
const MAP=350, SPEEDS={stand:5, crouch:2.2, prone:1.2};
let curSpeed=SPEEDS.stand, state='stand', moveX=0, moveZ=0, camYaw=0, targetYaw=0, camPitch=10, isMoving=false;
const canvas=document.getElementById('game');
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x87CEEB);
scene.fog=new THREE.Fog(0xB8D0A0, 60, 300);
const camera=new THREE.PerspectiveCamera(65, innerWidth/innerHeight, 0.1, 600);
const renderer=new THREE.WebGLRenderer({canvas, antialias:true});
renderer.setSize(innerWidth,innerHeight); renderer.setPixelRatio(Math.min(devicePixelRatio,1.2));
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
scene.add(new THREE.HemisphereLight(0xffffff, 0x444433, 0.8));
scene.add(new THREE.AmbientLight(0xffffff,0.4));
const sun=new THREE.DirectionalLight(0xFFF5E0,1); sun.position.set(120,180,80); sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048); sun.shadow.camera.left=-200; sun.shadow.camera.right=200; sun.shadow.camera.top=200; sun.shadow.camera.bottom=-200;
scene.add(sun);

function makeGround(){
  const c=document.createElement('canvas'); c.width=c.height=1024;
  const ctx=c.getContext('2d'); ctx.fillStyle='#6B8E4E'; ctx.fillRect(0,0,1024,1024);
  for(let i=0;i<40000;i++){ ctx.fillStyle=Math.random()>0.5?'#5A7A3E':'#7A9E5E'; ctx.fillRect(Math.random()*1024,Math.random()*1024,2,2); }
  const t=new THREE.CanvasTexture(c); t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(4,4); return t;
}
const ground=new THREE.Mesh(new THREE.PlaneGeometry(MAP,MAP), new THREE.MeshStandardMaterial({map:makeGround(), roughness:0.9}));
ground.rotation.x=-Math.PI/2; ground.receiveShadow=true; scene.add(ground);

const charGroup=new THREE.Group(); scene.add(charGroup); 
const yawGroup=new THREE.Group(); charGroup.add(yawGroup);
charGroup.position.set(0,0,0);
let mixer=null, actions={}, activeAction=null, soldierModel=null;
// BGMI SMOOTH VALUES
let targetScaleY=1.5, currentScaleY=1.5;
let targetPosY=0, currentPosY=0;
let targetPosZ=0, currentPosZ=0;
let targetRotX=0, currentRotX=0;
let targetRotY=Math.PI, currentRotY=Math.PI;
let camH=6, targetCamH=6;
let camDist=10, targetCamDist=10;

const loader=new GLTFLoader();
function playAnim(n){ if(!mixer||!actions[n]) return; if(activeAction===actions[n]) return; if(activeAction) activeAction.fadeOut(0.15); activeAction=actions[n]; activeAction.reset().fadeIn(0.15).play(); }
function onLoad(gltf){
  const m=gltf.scene; m.traverse(o=>{if(o.isMesh){o.castShadow=true; o.receiveShadow=true;}}); m.rotation.y=Math.PI; m.scale.set(1.5,1.5,1.5);
  soldierModel=m; yawGroup.add(m); mixer=new THREE.AnimationMixer(m);
  gltf.animations.forEach(c=>{actions[c.name.toLowerCase()]=mixer.clipAction(c);});
  if(actions['idle']) playAnim('idle'); document.getElementById('loading').style.display='none';
}
function onFail(){ document.getElementById('loading').style.display='none'; const b=new THREE.Mesh(new THREE.CapsuleGeometry(0.35,1,4,8), new THREE.MeshStandardMaterial({color:0x2A5A1A})); b.position.y=0.9; b.castShadow=true; const g=new THREE.Group(); g.add(b); g.rotation.y=Math.PI; yawGroup.add(g); soldierModel=g; }
loader.load('models/Soldier.glb', onLoad, undefined, ()=>loader.load('./models/Soldier.glb', onLoad, undefined, ()=>loader.load('https://threejs.org/examples/models/gltf/Soldier.glb', onLoad, undefined, onFail)));

function box(x,z,w,h,d,c){ const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d), new THREE.MeshStandardMaterial({color:c, roughness:0.8})); m.position.set(x,h/2,z); m.castShadow=true; m.receiveShadow=true; scene.add(m); return m; }
function spawnPoint(x,z,color){
  const base=box(x,z,15,0.5,15, color); 
  const holo=new THREE.Mesh(new THREE.BoxGeometry(15,10,15), new THREE.MeshStandardMaterial({color:color, transparent:true, opacity:0.25, emissive:color}));
  holo.position.set(x,5,z); scene.add(holo);
  const edge=new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(15,10,15)), new THREE.LineBasicMaterial({color:color}));
  edge.position.set(x,5,z); scene.add(edge);
}
spawnPoint(-160,-160,0x00FF00); spawnPoint(160,-160,0xFF0000); spawnPoint(-160,160,0x0088FF); spawnPoint(160,160,0xFFFF00);
function woodenHouse(x,z,type){
  const w=type==='small'?15:18, d=type==='small'?12:14, h=type==='small'?10:12;
  box(x,z,w,h,d,0x8B5A2B);
  const roof=new THREE.Mesh(new THREE.BoxGeometry(w+1,0.8,d+1), new THREE.MeshStandardMaterial({color:0x5A3A1A}));
  roof.position.set(x,h+0.4,z); roof.castShadow=true; scene.add(roof);
  box(x,z+d/2+0.2, 4,6,0.5, 0x3A2A1A);
}
woodenHouse(-100,-40,'small'); woodenHouse(-80,70,'medium'); woodenHouse(90,-80,'small'); woodenHouse(70,90,'medium');
woodenHouse(-40,0,'small'); woodenHouse(30,30,'medium'); woodenHouse(0,-70,'small'); woodenHouse(110,10,'medium');
function squareRuin(cx,cz){
  const t=1.5, h=5, gate=12, outer=20;
  box(cx-outer/2,cz, t,h,outer, 0xA99A7A); box(cx+outer/2,cz, t,h,outer, 0xA99A7A);
  box(cx-(outer-gate)/4, cz-outer/2, (outer-gate)/2, h, t, 0xA99A7A); box(cx+(outer-gate)/4, cz-outer/2, (outer-gate)/2, h, t, 0xA99A7A);
  box(cx, cz+outer/2, outer, h, t, 0xA99A7A);
}
squareRuin(-50,50); squareRuin(50,-50); squareRuin(-130,20); squareRuin(130,-20);
function lRuin(cx,cz){ const t=1.5,h=5; box(cx,cz,20,h,t,0xA99A7A); box(cx+7.5,cz+7.5, t,h,15, 0xA99A7A); }
lRuin(-20,80); lRuin(60,-70);
function cRuin(cx,cz){ const t=1.5,h=5; box(cx,cz,2,h,15,0xA99A7A); box(cx,cz-7.5,25,h,t,0xA99A7A); box(cx,cz+7.5,25,h,t,0xA99A7A); }
cRuin(80,40);
function partitionRuin(cx,cz){ const t=1.5,h=5; box(cx,cz,22,h,t,0xA99A7A); box(cx,cz, t,h,20,0xA99A7A); }
partitionRuin(0,120);
function boulder(x,z,w,d,h){ const m=new THREE.Mesh(new THREE.DodecahedronGeometry(Math.max(w,d)/2,0), new THREE.MeshStandardMaterial({color:0x6A6A6A, roughness:0.9})); m.position.set(x,h/2,z); m.scale.set(1, h/(Math.max(w,d)),1); m.castShadow=true; m.rotation.set(Math.random(),Math.random(),Math.random()); scene.add(m); }
boulder(-60,-10,12,10,8); boulder(60,20,12,10,8); boulder(-10,60,12,10,8); boulder(20,-60,12,10,8);
for(let i=0;i<8;i++){ boulder((Math.random()-0.5)*200, (Math.random()-0.5)*200, 6,5,4); }
for(let i=0;i<10;i++){ boulder((Math.random()-0.5)*250, (Math.random()-0.5)*250, 3,3,2.5); }
function tyre(x,z){ const m=new THREE.Mesh(new THREE.TorusGeometry(1.2,0.4,8,16), new THREE.MeshStandardMaterial({color:0x111111})); m.position.set(x,1,z); m.rotation.x=Math.PI/2; m.castShadow=true; scene.add(m); }
for(let i=0;i<30;i++) tyre((Math.random()-0.5)*280, (Math.random()-0.5)*280);
function lowWall(x,z){ box(x,z,8,3,1.5, 0x8A8A7A); }
for(let i=0;i<8;i++) lowWall((Math.random()-0.5)*200, (Math.random()-0.5)*200);
function crateSmall(x,z){ box(x,z,4,3,4, 0xC49A6A); }
for(let i=0;i<12;i++) crateSmall((Math.random()-0.5)*220, (Math.random()-0.5)*220);
function crateLarge(x,z){ box(x,z,6,5,6, 0x8B4513); }
for(let i=0;i<6;i++) crateLarge((Math.random()-0.5)*180, (Math.random()-0.5)*180);
function plank(x,z){ const m=new THREE.Mesh(new THREE.BoxGeometry(8,0.5,1), new THREE.MeshStandardMaterial({color:0x8B7355})); m.position.set(x,0.25,z); m.castShadow=true; m.rotation.y=Math.random()*Math.PI; scene.add(m); }
for(let i=0;i<10;i++) plank((Math.random()-0.5)*240, (Math.random()-0.5)*240);
function rustedCar(x,z){ const body=box(x,z,15,3,6, 0x8B3A2A); box(x+2,z,6,2,5.5, 0x3A3A3A); const wheelMat=0x111111; [ -5,5].forEach(dx=>{ [-2,2].forEach(dz=>{ const w=new THREE.Mesh(new THREE.CylinderGeometry(1,1,0.8,8), new THREE.MeshStandardMaterial({color:wheelMat})); w.rotation.z=Math.PI/2; w.position.set(x+dx,1,z+dz); scene.add(w); }); }); }
for(let i=0;i<8;i++) rustedCar((Math.random()-0.5)*260, (Math.random()-0.5)*260);
function tree(x,z){ const trunk=new THREE.Mesh(new THREE.CylinderGeometry(0.5,0.8,8,6), new THREE.MeshStandardMaterial({color:0x5A3A1A})); trunk.position.set(x,4,z); trunk.castShadow=true; scene.add(trunk); const leaves=new THREE.Mesh(new THREE.SphereGeometry(6,8,8), new THREE.MeshStandardMaterial({color:0x2A6A2A})); leaves.position.set(x,14,z); leaves.castShadow=true; scene.add(leaves); }
for(let i=0;i<20;i++){ const ang=Math.random()*Math.PI*2; const r=MAP/2-10; tree(Math.cos(ang)*r, Math.sin(ang)*r); }

const joy=document.getElementById('joy'), knob=document.getElementById('knob');
let joyId=null, camId=null, joyCx=0, joyCy=0, camLx=0, camLy=0;
function getJoyCenter(){ const r=joy.getBoundingClientRect(); return {x:r.left+r.width/2, y:r.top+r.height/2}; }
document.addEventListener('touchstart', e=>{ for(let t of e.changedTouches){ if(t.clientX < innerWidth*0.5 && joyId===null){ joyId=t.identifier; const c=getJoyCenter(); joyCx=c.x; joyCy=c.y; handleJoy(t); } else if(t.clientX >= innerWidth*0.5 && camId===null){ camId=t.identifier; camLx=t.clientX; camLy=t.clientY; } } },{passive:false});
document.addEventListener('touchmove', e=>{ for(let t of e.touches){ if(t.identifier===joyId) handleJoy(t); if(t.identifier===camId){ let dx=t.clientX-camLx, dy=t.clientY-camLy; targetYaw-=dx*0.4; camPitch-=dy*0.4; camPitch=Math.max(-10,Math.min(30,camPitch)); camLx=t.clientX; camLy=t.clientY; } } e.preventDefault(); },{passive:false});
document.addEventListener('touchend', e=>{ for(let t of e.changedTouches){ if(t.identifier===joyId){ joyId=null; moveX=0; moveZ=0; isMoving=false; knob.style.transform='translate(-50%,-50%)'; } if(t.identifier===camId) camId=null; } },{passive:false});
function handleJoy(t){
  let dx=t.clientX-joyCx, dy=t.clientY-joyCy, dist=Math.sqrt(dx*dx+dy*dy), max=45;
  if(dist>max){ dx=dx/max*45; dy=dy/max*45; dist=45; }
  knob.style.transform=`translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
  if(dist<8){ moveX=0; moveZ=0; isMoving=false; return; }
  isMoving=true; moveX=dx/max; moveZ=dy/max;
}
const standBtn=document.getElementById('stand'), crouchBtn=document.getElementById('crouch'), proneBtn=document.getElementById('prone');
function setState(s){
  state=s; standBtn.classList.toggle('active',s==='stand'); crouchBtn.classList.toggle('active',s==='crouch'); proneBtn.classList.toggle('active',s==='prone');
  if(!soldierModel) return;
  if(s==='stand'){ 
    curSpeed=SPEEDS.stand; 
    targetScaleY=1.5; targetPosY=0; targetPosZ=0; targetRotX=0; targetRotY=Math.PI;
    targetCamH=6; targetCamDist=10;
    if(mixer && activeAction!==actions['idle']) playAnim('idle');
  }
  if(s==='crouch'){ 
    curSpeed=SPEEDS.crouch; 
    targetScaleY=0.9; targetPosY=-0.3; targetPosZ=0; targetRotX=0; targetRotY=Math.PI;
    targetCamH=6; targetCamDist=10;
    if(mixer && activeAction!==actions['idle']) playAnim('idle');
  }
  if(s==='prone'){ 
    curSpeed=SPEEDS.prone; 
    targetScaleY=1.5; targetPosY=0.2; targetPosZ=0.8; targetRotX=-Math.PI/2; targetRotY=0;
    targetCamH=6; targetCamDist=10;
    if(mixer){ mixer.stopAllAction(); activeAction=null; }
  }
}
standBtn.addEventListener('touchstart', e=>{e.preventDefault(); setState('stand');},{passive:false});
crouchBtn.addEventListener('touchstart', e=>{e.preventDefault(); setState('crouch');},{passive:false});
proneBtn.addEventListener('touchstart', e=>{e.preventDefault(); setState('prone');},{passive:false});
const clock=new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const delta=clock.getDelta(); if(mixer) mixer.update(delta);
  if(state==='stand' || state==='crouch'){ if(isMoving){ if(actions['walk']||actions['run']) playAnim(actions['run']?'run':'walk'); } else { if(actions['idle']) playAnim('idle'); } }
  // BGMI SMOOTH LERP - no blink
  currentScaleY += (targetScaleY - currentScaleY)*0.15;
  currentPosY += (targetPosY - currentPosY)*0.15;
  currentPosZ += (targetPosZ - currentPosZ)*0.15;
  currentRotX += (targetRotX - currentRotX)*0.15;
  currentRotY += (targetRotY - currentRotY)*0.15;
  camH += (targetCamH - camH)*0.08;
  camDist += (targetCamDist - camDist)*0.08;
  if(soldierModel){
    soldierModel.scale.y = currentScaleY;
    soldierModel.position.y = currentPosY;
    soldierModel.position.z = currentPosZ;
    soldierModel.rotation.x = currentRotX;
    soldierModel.rotation.y = currentRotY;
  }
  camYaw+=(targetYaw-camYaw)*0.15;
  if(moveX!==0||moveZ!==0){
    const rad=THREE.MathUtils.degToRad(camYaw);
    const finalX = moveZ*Math.sin(rad) + moveX*Math.cos(rad);
    const finalZ = moveZ*Math.cos(rad) - moveX*Math.sin(rad);
    charGroup.position.x+=finalX*curSpeed*0.07;
    charGroup.position.z+=finalZ*curSpeed*0.07;
    if(finalX!==0||finalZ!==0) yawGroup.rotation.y=Math.atan2(finalX,finalZ);
    const lim=MAP/2-3; charGroup.position.x=Math.max(-lim,Math.min(lim,charGroup.position.x)); charGroup.position.z=Math.max(-lim,Math.min(lim,charGroup.position.z));
  }
  const yawRad=THREE.MathUtils.degToRad(camYaw), pitchRad=THREE.MathUtils.degToRad(camPitch);
  camera.position.x=charGroup.position.x+Math.sin(yawRad)*Math.cos(pitchRad)*camDist;
  camera.position.z=charGroup.position.z+Math.cos(yawRad)*Math.cos(pitchRad)*camDist;
  camera.position.y=charGroup.position.y+camH+Math.sin(pitchRad)*camDist*0.3;
  camera.lookAt(charGroup.position.x, charGroup.position.y+0.8, charGroup.position.z);
  document.getElementById('top').textContent=`FINAL 350x350 FT | ${state.toUpperCase()} | ${isMoving?'RUN':'IDLE'}`;
  renderer.render(scene,camera);
}
animate();
window.addEventListener('resize', ()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); });
</script>
</body>
</html>
