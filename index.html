<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no, interactive-widget=resizes-content">
<title>TDM 350x350 FINAL FULL NOTCH</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;touch-action:none;user-select:none;-webkit-user-select:none}
html,body{width:100%;height:100%;background:#000;overflow:hidden;position:fixed;overscroll-behavior:none}
#game{position:fixed;left:0;top:0;right:0;bottom:0;width:100vw;width:100dvw;height:100vh;height:100dvh;height:100svh;display:block;background:#3d6b22;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
#joy{position:fixed;left:4vw;left:calc(4vw + env(safe-area-inset-left));bottom:8vh;bottom:calc(8vh + env(safe-area-inset-bottom));width:30vw;max-width:130px;height:30vw;max-height:130px;border:2px solid rgba(255,255,255,0.9);border-radius:50%;background:rgba(255,255,255,0.12);z-index:10}
#knob{position:absolute;left:50%;top:50%;width:42%;height:42%;background:#fff;border-radius:50%;transform:translate(-50%,-50%)}
#cam{position:fixed;right:0;top:0;width:62vw;height:100vh;height:100dvh;z-index:5}
#top{position:fixed;top:0;top:env(safe-area-inset-top,0px);left:0;right:0;background:rgba(0,0,0,0.7);color:#0f0;padding:8px 12px;font:700 11px monospace;z-index:20}
#btns{position:fixed;right:3vw;right:calc(3vw + env(safe-area-inset-right));bottom:8vh;bottom:calc(8vh + env(safe-area-inset-bottom));display:flex;gap:2.5vw;z-index:10}
.b{width:19vw;max-width:72px;height:19vw;max-height:72px;border-radius:50%;border:2px solid #fff;background:rgba(0,0,0,0.6);color:#fff;font:700 10px sans-serif}
.b.active{background:#00aaff;color:#000}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="joy"><div id="knob"></div></div>
<div id="cam"></div>
<div id="top">350x350 FT | 122500 SqFt | Full Map</div>
<div id="btns">
<button class="b active" id="stand">STANDING</button>
<button class="b" id="crouch">CROUCH</button>
<button class="b" id="prone">PRONE</button>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const MAP=350;
const SPEEDS={stand:15.4,sprint:20.6,crouch:4.2,crouchSprint:15.7,prone:3.9};
let curSpeed=SPEEDS.stand, state='stand', moveX=0, moveZ=0, camYaw=0, targetYaw=0, camPitch=22, isSprint=false;
const canvas=document.getElementById('game');
const scene=new THREE.Scene(); scene.background=new THREE.Color(0x3d6b22);
const camera=new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 1000);
const renderer=new THREE.WebGLRenderer({canvas, antialias:true});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
scene.add(new THREE.AmbientLight(0xffffff,0.85));
const sun=new THREE.DirectionalLight(0xffffff,0.65); sun.position.set(80,120,60); scene.add(sun);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(MAP,MAP), new THREE.MeshLambertMaterial({color:0x4a8a2e}));
ground.rotation.x=-Math.PI/2; scene.add(ground);
const grid=new THREE.GridHelper(MAP,35,0x1a3310,0x2d5a1f); grid.position.y=0.1; scene.add(grid);
// BLUE CHARACTER 6 FT
const charGroup=new THREE.Group();
const body=new THREE.Mesh(new THREE.BoxGeometry(1.4,3,0.9), new THREE.MeshLambertMaterial({color:0x0088ff}));
body.position.y=2.6; charGroup.add(body);
const head=new THREE.Mesh(new THREE.BoxGeometry(0.9,0.9,0.9), new THREE.MeshLambertMaterial({color:0xffdbac}));
head.position.y=4.7; charGroup.add(head);
const legs=new THREE.Mesh(new THREE.BoxGeometry(1.2,1.8,0.9), new THREE.MeshLambertMaterial({color:0x0033aa}));
legs.position.y=0.9; charGroup.add(legs);
charGroup.position.set(0,0,140); scene.add(charGroup);
function box(x,z,w,h,d,color){ const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d), new THREE.MeshLambertMaterial({color})); m.position.set(x,h/2,z); scene.add(m); return m; }
// 8 HOUSES
box(0,155,15,10,12,0x8b5a2b); box(80,140,18,12,14,0x7a4a2b); box(-90,0,15,10,12,0x8b5a2b); box(95,-5,18,12,14,0x7a4a2b); box(-80,155,15,10,12,0x8b5a2b); box(0,-150,15,10,12,0x8b5a2b); box(70,-145,18,12,14,0x7a4a2b); box(120,-30,15,10,12,0x8b5a2b);
// 8 RUINS WALLS - Thickness 1.5FT Height 5FT Gate 12FT
function ruinWall(cx,cz,w,d){ const t=1.5,h=5; box(cx-w/2,cz,t,h,d,0x6b6b6b); box(cx+w/2,cz,t,h,d,0x6b6b6b); box(cx,cz-d/2,w,h,t,0x6b6b6b); box(cx,cz+d/2,w,h,t,0x6b6b6b); }
ruinWall(0,90,20,20); ruinWall(-90,20,20,20); ruinWall(-90,-20,20,20); ruinWall(90,-20,25,20); ruinWall(0,-60,22,20); ruinWall(30,90,18,18); ruinWall(-45,60,18,18); ruinWall(90,10,20,20);
// 4 LARGE BOULDERS 12x10x8H
box(25,55,12,8,10,0x4a3a2e); box(-30,-25,12,8,10,0x4a3a2e); box(40,-25,12,8,10,0x4a3a2e); box(-35,5,12,8,10,0x4a3a2e);
// 8 MEDIUM BOULDERS 6x5x4H
for(let i=0;i<8;i++) box((Math.random()-0.5)*120,(Math.random()-0.5)*120,6,4,5,0x5a5a5a);
// 10 SMALL BOULDERS 3x3x2.5H
for(let i=0;i<10;i++) box((Math.random()-0.5)*100,(Math.random()-0.5)*100,3,2.5,3,0x6a6a6a);
// 30 TYRES 2.5x2.5x2H
for(let i=0;i<30;i++){ const t=new THREE.Mesh(new THREE.TorusGeometry(1.2,0.4,6,12), new THREE.MeshLambertMaterial({color:0x111111})); t.position.set((Math.random()-0.5)*220,0.6,(Math.random()-0.5)*220); t.rotation.x=Math.PI/2; scene.add(t); }
// 8 LOW WALLS 8x1.5x3H
for(let i=0;i<8;i++) box((Math.random()-0.5)*200,(Math.random()-0.5)*200,8,3,1.5,0x777777);
// 12 SMALL CRATES 4x4x3H + 6 LARGE 6x6x5H
for(let i=0;i<12;i++) box((Math.random()-0.5)*200,(Math.random()-0.5)*200,4,3,4,0x8b6a2e);
for(let i=0;i<6;i++) box((Math.random()-0.5)*180,(Math.random()-0.5)*180,6,5,6,0x9a7a3e);
// 10 PLANKS 8x1x0.5H
for(let i=0;i<10;i++) box((Math.random()-0.5)*220,(Math.random()-0.5)*220,8,0.5,1,0xc2a67a);
// 8 CARS 15x6x5H
[[-110,110],[-110,95],[-110,-95],[-100,-110],[110,110],[110,95],[110,-110],[100,-95]].forEach(p=> box(p[0],p[1],15,5,6,0x2a2a2a));
// TREES 12FT DIA
for(let i=0;i<18;i++){ const trunk=box((Math.random()-0.5)*300,(Math.random()-0.5)*300,1.5,8,1.5,0x3d2b1f); const leaves=new THREE.Mesh(new THREE.SphereGeometry(6,6,6), new THREE.MeshLambertMaterial({color:0x1a5a1a})); leaves.position.set(trunk.position.x,12,trunk.position.z); scene.add(leaves); }
// JOYSTICK LEFT - BGMI FIX
const joy=document.getElementById('joy'), knob=document.getElementById('knob');
let joyActive=false, cx=0, cy=0;
function getCenter(){const rc=joy.getBoundingClientRect(); return {x:rc.left+rc.width/2,y:rc.top+rc.height/2};}
joy.addEventListener('touchstart', e=>{ e.preventDefault(); joyActive=true; const c=getCenter(); cx=c.x; cy=c.y; handle(e.touches[0]); },{passive:false});
joy.addEventListener('touchmove', e=>{ e.preventDefault(); if(joyActive) handle(e.touches[0]); },{passive:false});
joy.addEventListener('touchend', e=>{ e.preventDefault(); joyActive=false; moveX=0; moveZ=0; isSprint=false; knob.style.transform='translate(-50%,-50%)'; },{passive:false});
function handle(t){
  let dx=t.clientX-cx, dy=t.clientY-cy, dist=Math.sqrt(dx*dx+dy*dy), max=45, force=dist/max;
  if(dist>max){ dx=dx/max*45; dy=dy/max*45; force=1; }
  knob.style.transform=`translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
  moveX=dx/max; moveZ=-dy/max;
  if(force>0.82){ isSprint=true; curSpeed=state==='crouch'?SPEEDS.crouchSprint:state==='prone'?SPEEDS.prone:SPEEDS.sprint; }
  else { isSprint=false; curSpeed=state==='crouch'?SPEEDS.crouch:state==='prone'?SPEEDS.prone:SPEEDS.stand; }
}
// CAMERA RIGHT - BGMI COPY
const camArea=document.getElementById('cam'); let lx=0,ly=0;
camArea.addEventListener('touchstart', e=>{ lx=e.touches[0].clientX; ly=e.touches[0].clientY; },{passive:false});
camArea.addEventListener('touchmove', e=>{
  e.preventDefault(); const dx=e.touches[0].clientX-lx, dy=e.touches[0].clientY-ly;
  targetYaw-=dx*0.35; camPitch-=dy*0.35; camPitch=Math.max(-40,Math.min(65,camPitch));
  lx=e.touches[0].clientX; ly=e.touches[0].clientY;
},{passive:false});
// BUTTONS
const standBtn=document.getElementById('stand'), crouchBtn=document.getElementById('crouch'), proneBtn=document.getElementById('prone');
function setState(s){
  state=s; standBtn.classList.toggle('active',s==='stand'); crouchBtn.classList.toggle('active',s==='crouch'); proneBtn.classList.toggle('active',s==='prone');
  if(s==='stand'){ body.scale.y=1; body.position.y=2.6; head.position.y=4.7; legs.scale.y=1; }
  if(s==='crouch'){ body.scale.y=0.65; body.position.y=1.7; head.position.y=3.1; legs.scale.y=0.6; }
  if(s==='prone'){ body.scale.y=0.28; body.position.y=0.7; head.position.y=1.2; legs.scale.y=0.28; }
  curSpeed=s==='crouch'?SPEEDS.crouch:s==='prone'?SPEEDS.prone:SPEEDS.stand;
}
standBtn.addEventListener('touchstart', e=>{e.preventDefault(); setState('stand');},{passive:false});
crouchBtn.addEventListener('touchstart', e=>{e.preventDefault(); setState('crouch');},{passive:false});
proneBtn.addEventListener('touchstart', e=>{e.preventDefault(); setState('prone');},{passive:false});
function animate(){
  requestAnimationFrame(animate);
  camYaw+=(targetYaw-camYaw)*0.14;
  if(moveX!==0||moveZ!==0){
    const rad=THREE.MathUtils.degToRad(camYaw);
    const mx=moveX*Math.cos(rad)+moveZ*Math.sin(rad);
    const mz=-moveX*Math.sin(rad)+moveZ*Math.cos(rad);
    charGroup.position.x+=mx*curSpeed*0.05; charGroup.position.z+=mz*curSpeed*0.05;
    charGroup.rotation.y=Math.atan2(mx,mz);
    const lim=MAP/2-4; charGroup.position.x=Math.max(-lim,Math.min(lim,charGroup.position.x)); charGroup.position.z=Math.max(-lim,Math.min(lim,charGroup.position.z));
  }
  const dist=16, h=7 + (state==='crouch'?-2:state==='prone'?-4:0);
  const yawRad=THREE.MathUtils.degToRad(camYaw), pitchRad=THREE.MathUtils.degToRad(camPitch);
  camera.position.x=charGroup.position.x+Math.sin(yawRad)*Math.cos(pitchRad)*dist;
  camera.position.z=charGroup.position.z+Math.cos(yawRad)*Math.cos(pitchRad)*dist;
  camera.position.y=charGroup.position.y+h+Math.sin(pitchRad)*dist;
  camera.lookAt(charGroup.position.x, charGroup.position.y+2, charGroup.position.z);
  document.getElementById('top').textContent=`350x350 FT | ${curSpeed.toFixed(1)} ft/s | ${state.toUpperCase()}${isSprint?' +SPRINT':''} | FULL MAP`;
  renderer.render(scene,camera);
}
animate();
window.addEventListener('resize', ()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); });
document.body.addEventListener('touchstart', function goFS(){ if(document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(()=>{}); document.body.removeEventListener('touchstart',goFS); }, {once:true});
</script>
</body>
</html>
