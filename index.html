<!DOCTYPE html>
<html>
<head>
<title>TDM 350x350 - Landscape TPP</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="screen-orientation" content="landscape">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/nipplejs/0.9.0/nipplejs.min.js"></script>
<style>
html,body{margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#000; position:fixed}
canvas{display:block; width:100%!important; height:100%!important}
#joystick{position:fixed; bottom:5vh; left:3vw; width:22vh; height:22vh; z-index:10}
#info{position:fixed; top:2vh; left:2vw; color:white; font-family:monospace; font-size:1.8vh; background:rgba(0,0,0,0.6); padding:1vh 1vw; border-radius:1vh}
#buttons{position:fixed; bottom:5vh; right:3vw; display:flex; gap:2vw; z-index:10}
.btn{width:12vh; height:12vh; background:rgba(255,255,255,0.15); border:0.3vh solid white; border-radius:50%; color:white; font-size:1.5vh; backdrop-filter:blur(5px)}
.btn:active{background:rgba(255,255,255,0.4)}
#rotateMsg{position:fixed; inset:0; background:#000; color:white; display:none; justify-content:center; align-items:center; font-size:5vw; z-index:100; font-family:monospace}
@media (orientation:portrait){#rotateMsg{display:flex} canvas{display:none!important}}
</style>
</head>
<body>
<div id="rotateMsg">📱 Phone ko Landscape karo 🔄</div>
<div id="info">350x350 FT | BGMI SPEED | TPP | 70% DMG OUTSIDE</div>
<div id="joystick"></div>
<div id="buttons">
<button class="btn" id="crouch">CROUCH</button>
<button class="btn" id="prone">PRONE</button>
<button class="btn" id="sprint">SPRINT</button>
<button class="btn" id="fs">⛶ FS</button>
</div>

<script>
const MAP_SIZE=350, CHAR_HEIGHT=6;
const SPEEDS={sprint:20.6, run:15.4, crouchSprint:15.7, crouchWalk:4.2, prone:3.9, walk:5.5};
let currentSpeed=SPEEDS.run, health=100;

// Auto Fullscreen on first touch
function goFS(){
  if(!document.fullscreenElement){
    document.documentElement.requestFullscreen().catch(()=>{});
    if(screen.orientation && screen.orientation.lock){ screen.orientation.lock('landscape').catch(()=>{}); }
  }
}
document.body.addEventListener('touchstart', goFS, {once:true});
document.body.addEventListener('click', goFS, {once:true});
document.getElementById('fs').onclick=goFS;

// Scene
const scene=new THREE.Scene(); scene.background=new THREE.Color(0x4a7c2e);
const camera=new THREE.PerspectiveCamera(65, innerWidth/innerHeight, 0.1, 1000);
const renderer=new THREE.WebGLRenderer({antialias:true, powerPreference:"high-performance"});
renderer.setSize(innerWidth, innerHeight); renderer.setPixelRatio(Math.min(devicePixelRatio,2));
document.body.appendChild(renderer.domElement);

const ground=new THREE.Mesh(new THREE.PlaneGeometry(MAP_SIZE,MAP_SIZE), new THREE.MeshStandardMaterial({color:0x3d6b22}));
ground.rotation.x=-Math.PI/2; scene.add(ground);
scene.add(new THREE.GridHelper(MAP_SIZE,35,0x000000,0x2a4a18));
scene.add(new THREE.AmbientLight(0xffffff,0.85));
const sun=new THREE.DirectionalLight(0xffffff,0.6); sun.position.set(100,200,100); scene.add(sun);

// Character 6ft TPP
const charGroup=new THREE.Group();
const body=new THREE.Mesh(new THREE.CapsuleGeometry(1.2,CHAR_HEIGHT-2.4,4,8), new THREE.MeshStandardMaterial({color:0x1e90ff}));
body.position.y=CHAR_HEIGHT/2; charGroup.add(body); charGroup.position.set(0,0,0); scene.add(charGroup);

// Map Objects - Your exact dims
